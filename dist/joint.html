    <div class="heading"><div><small>IPA 小游戏</small><h1>僵尸组合</h1></div><p>左边是完整拼音卡。依次点击两只僵尸，把它们携带的字符拼成卡上的拼音。</p></div>

    </div>

    <p id="message" role="status" aria-live="polite"></p>
