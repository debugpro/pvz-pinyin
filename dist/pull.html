    <div class="heading"><div><small>IPA 小游戏</small><h1>僵尸抓字</h1></div><p>听发音、看目标词，在抓钩摆到合适角度时点击场景。抓住字母，凑齐目标词。</p></div>

    </div>
    <div class="controls"><button id="sound" type="button" disabled>♫ 重听发音</button><button id="pause" type="button" disabled>Ⅱ 暂停</button><button id="restart" type="button" disabled>重新开始</button><span id="progress">0 / 16 题</span></div>
    <p id="message" role="status" aria-live="polite"></p>
